<style>
  :root{
    --bg:#f6f7f9;
    --fg:#1f2328;
    --muted:#9aa1ac;
    --btn-bg:#ffffff;
    --line:rgba(17,24,39,.13);
    --ball:clamp(38px, 12.2vw, 56px);
    --gap:clamp(6px, 1.9vw, 12px);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d0f13;
      --fg:#eef1f6;
      --muted:#7f8794;
      --btn-bg:#1a1d23;
      --line:rgba(255,255,255,.12);
    }
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;padding:0}
  body{
    min-height:100dvh;
    background:var(--bg);
    color:var(--fg);
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:calc(20px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));
  }

  .stage{
    margin-block:auto;
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  h1{
    margin:0 0 clamp(28px, 8.5vw, 46px);
    font-size:clamp(21px, 6.2vw, 28px);
    font-weight:700;
    letter-spacing:-.02em;
    line-height:1.25;
  }

  .balls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:var(--gap);
    margin:0 0 clamp(30px, 9vw, 46px);
  }

  .ball{
    flex:0 0 auto;
    width:var(--ball);
    height:var(--ball);
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:calc(var(--ball) * .40);
    font-weight:800;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;
    line-height:1;
    color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.20);
    background-image:radial-gradient(circle at 32% 24%, rgba(255,255,255,.55), rgba(255,255,255,0) 62%);
    box-shadow:inset 0 -2px 4px rgba(0,0,0,.10), 0 2px 7px -2px rgba(16,24,40,.22);
  }
  .ball.c1{background-color:#fbc400}
  .ball.c2{background-color:#69c8f2}
  .ball.c3{background-color:#ff7272}
  .ball.c4{background-color:#aaaab0}
  .ball.c5{background-color:#b0d840}

  .actions{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }

  .draw{
    -webkit-appearance:none;appearance:none;
    height:48px;
    padding:0 28px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--btn-bg);
    color:var(--fg);
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    letter-spacing:-.01em;
    cursor:pointer;
    transition:border-color .15s, box-shadow .15s, transform .12s;
    touch-action:manipulation;
  }
  .draw:hover{border-color:rgba(120,130,145,.45);box-shadow:0 1px 3px rgba(16,24,40,.08)}
  .draw:active{transform:scale(.985)}
  .draw:disabled{opacity:.65;cursor:default}

  .copy{
    -webkit-appearance:none;appearance:none;
    width:48px;height:48px;
    display:grid;place-items:center;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--btn-bg);
    color:var(--muted);
    cursor:pointer;
    transition:border-color .15s, color .15s, transform .12s;
    touch-action:manipulation;
  }
  .copy:hover{color:var(--fg);border-color:rgba(120,130,145,.45)}
  .copy:active{transform:scale(.96)}
  .copy svg{width:19px;height:19px;display:block}
  .copy .ok{display:none}
  .copy.done{color:#12a150;border-color:rgba(18,161,80,.45)}
  .copy.done .dup{display:none}
  .copy.done .ok{display:block}

  .note{
    margin:22px 0 0;
    max-width:360px;
    font-size:11px;
    line-height:1.65;
    letter-spacing:.005em;
    color:var(--muted);
    text-align:center;
  }

  :focus-visible{outline:2px solid #3b82f6;outline-offset:3px}

  .toast{
    position:fixed;
    left:50%;
    bottom:calc(22px + env(safe-area-inset-bottom));
    transform:translate(-50%, 8px);
    background:rgba(17,24,39,.9);
    color:#fff;
    font-size:12.5px;
    font-weight:600;
    padding:9px 14px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    backdrop-filter:blur(8px);
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (prefers-color-scheme: dark){
    .toast{background:rgba(238,241,246,.94);color:#0d0f13}
  }

  @keyframes pop{
    from{opacity:0;transform:scale(.55)}
    to{opacity:1;transform:scale(1)}
  }
  .ball.pop{animation:pop .32s cubic-bezier(.2,.9,.3,1.25) both}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important}
  }

  @media (max-height:420px){
    h1{margin-bottom:16px}
    .balls{margin-bottom:18px}
    .note{margin-top:14px}
  }
</style>
</head>
<body>
<main class="stage">
  <h1>로또 번호 추천</h1>

  <div class="balls" id="balls" role="group" aria-label="추천 번호 6개" aria-live="polite">
    <span class="ball c1">03</span>
    <span class="ball c2">12</span>
    <span class="ball c3">24</span>
    <span class="ball c4">33</span>
    <span class="ball c5">41</span>
    <span class="ball c1">07</span>
  </div>

  <div class="actions">
    <button class="draw" id="draw" type="button">번호 뽑기</button>
    <button class="copy" id="copy" type="button" aria-label="번호 복사" title="번호 복사">
      <svg class="dup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="9" width="11" height="11" rx="2.5"></rect>
        <path d="M15 5.5A2.5 2.5 0 0 0 12.5 3h-6A3.5 3.5 0 0 0 3 6.5v6A2.5 2.5 0 0 0 5.5 15"></path>
      </svg>
      <svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12.5 9.5 17 19 7"></path>
      </svg>
    </button>
  </div>
</main>

<p class="note">본 사이트는 조합 참고용이며, 로또는 매 회차 독립 시행입니다.</p>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var COUNT = 6;
  var MAX = 45;

  var ballsEl = document.getElementById("balls");
  var drawBtn = document.getElementById("draw");
  var copyBtn = document.getElementById("copy");
  var toastEl = document.getElementById("toast");
  var numbers = [];
  var toastTimer = null;

  function randInt(n) {
    // unbiased random int in [0, n)
    if (window.crypto && window.crypto.getRandomValues) {
      var limit = Math.floor(4294967296 / n) * n;
      var buf = new Uint32Array(1);
      var v;
      do { window.crypto.getRandomValues(buf); v = buf[0]; } while (v >= limit);
      return v % n;
    }
    return Math.floor(Math.random() * n);
  }

  function pickLine() {
    var pool = [];
    for (var i = 1; i <= MAX; i++) pool.push(i);
    // partial Fisher–Yates
    for (var j = 0; j < COUNT; j++) {
      var k = j + randInt(MAX - j);
      var t = pool[j]; pool[j] = pool[k]; pool[k] = t;
    }
    return pool.slice(0, COUNT).sort(function (a, b) { return a - b; });
  }

  function ballClass(n) {
    if (n <= 10) return "c1";
    if (n <= 20) return "c2";
    if (n <= 30) return "c3";
    if (n <= 40) return "c4";
    return "c5";
  }

  function pad(n) { return n < 10 ? "0" + n : String(n); }

  function render(animate) {
    ballsEl.innerHTML = "";
    numbers.forEach(function (n, idx) {
      var b = document.createElement("span");
      b.className = "ball " + ballClass(n);
      b.textContent = pad(n);
      if (animate) {
        b.classList.add("pop");
        b.style.animationDelay = (idx * 55) + "ms";
      }
      ballsEl.appendChild(b);
    });
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1600);
  }

  function copyNumbers() {
    var text = numbers.map(pad).join(", ");
    function done() {
      copyBtn.classList.add("done");
      toast("번호 6개를 복사했어요");
      setTimeout(function () { copyBtn.classList.remove("done"); }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text, done); });
    } else {
      legacyCopy(text, done);
    }
  }

  function legacyCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    if (ok) done(); else toast("복사에 실패했어요");
  }

  function draw(animate) {
    numbers = pickLine();
    render(animate);
  }

  drawBtn.addEventListener("click", function () {
    drawBtn.disabled = true;
    draw(true);
    setTimeout(function () { drawBtn.disabled = false; }, 260);
  });

  copyBtn.addEventListener("click", copyNumbers);

  draw(false);
})();
</script>
</body>
